name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
  API_DB_PASSWORD: api_dev
  WORKER_DB_PASSWORD: worker_dev

jobs:
  uji:
    name: Bangun, periksa tipe, dan uji
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Siapkan basis data sembilan layanan
        run: |
          for s in svc-referensi svc-identitas svc-perencanaan svc-penatausahaan \
                   svc-pelaporan svc-audit svc-integrasi svc-pemantauan svc-bantuan; do
            node scripts/migrate.mjs "$s" --seed
          done
      - run: pnpm test

  kafka:
    name: Adapter Kafka terhadap Redpanda
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: redpandadata/redpanda:v24.2.13
        ports: ["19092:19092"]
        options: >-
          --health-cmd "rpk cluster health -X brokers=localhost:19092 | grep -q 'Healthy:.*true'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arkas/common-ms build
      - name: Terbitkan & konsumsi CloudEvent lewat broker sungguhan
        env:
          BROKER_BROKERS: localhost:19092
          KAFKAJS_NO_PARTITIONER_WARNING: "1"
        run: node scripts/uji-kafka.mjs

  kontainer:
    name: Bangun citra ${{ matrix.layanan }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layanan:
          - svc-referensi
          - svc-identitas
          - svc-perencanaan
          - svc-penatausahaan
          - svc-pelaporan
          - svc-audit
          - svc-integrasi
          - svc-pemantauan
          - svc-bantuan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: LAYANAN=${{ matrix.layanan }}
          tags: arkas/${{ matrix.layanan }}:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kontainer-web:
    name: Bangun citra web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          tags: arkas/web:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
